<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工具箱與高斯消去法計算器</title>
  <!-- KaTeX 數學公式渲染 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <style>
    /* --------------------------------------------------
       全站基礎與暗色主題設定 (CSS Variables)
    -------------------------------------------------- */
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e24;
      --card-hover: #2a2a32;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: #374151;
      --modal-bg: rgba(0, 0, 0, 0.75);
      --radius: 12px;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    /* --------------------------------------------------
       頁面切換控制 (Views)
    -------------------------------------------------- */
    .view {
      display: none;
      width: 100%;
      max-width: 1200px;
      padding: 2rem;
      animation: fadeIn 0.4s ease-in-out forwards;
    }

    .view.active {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* --------------------------------------------------
       頁面 1：首頁 UI
    -------------------------------------------------- */
    #page-home {
      text-align: center;
    }

    .home-title {
      font-size: 4rem;
      font-weight: 800;
      margin-bottom: 2rem;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
    }

    .btn-gradient {
      background: var(--primary-gradient);
      color: #fff;
      border: none;
      padding: 1rem 2.5rem;
      font-size: 1.25rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-gradient:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(99, 102, 241, 0.6);
    }

    /* --------------------------------------------------
       頁面 2：3x3 網格選單 UI
    -------------------------------------------------- */
    .menu-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .menu-title {
      font-size: 2rem;
      font-weight: 700;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
      width: 100%;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 2rem;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      transition: all 0.3s ease;
      box-shadow: var(--shadow);
    }

    .card.interactive {
      cursor: pointer;
      border-color: rgba(99, 102, 241, 0.4);
    }

    .card.interactive:hover {
      background-color: var(--card-hover);
      transform: translateY(-5px);
      border-color: var(--primary);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7);
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .card-placeholder {
      color: var(--text-muted);
      font-size: 0.9rem;
      border: 2px dashed var(--border-color);
      background: transparent;
    }

    /* --------------------------------------------------
       彈窗 / Modal 通用樣式
    -------------------------------------------------- */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: var(--modal-bg);
      backdrop-filter: blur(5px);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      width: 100%;
      max-width: 900px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow);
      animation: modalUp 0.3s ease;
      overflow: hidden;
    }

    @keyframes modalUp {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 1.3rem;
      font-weight: 700;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.8rem;
      cursor: pointer;
      line-height: 1;
    }

    .close-btn:hover {
      color: var(--text-main);
    }

    .modal-body {
      padding: 1.5rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* 通用按鈕風格 */
    .btn {
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: #2b2b36;
      color: var(--text-main);
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      background: #3b3b4a;
    }

    .btn-sm {
      padding: 0.3rem 0.6rem;
      font-size: 0.85rem;
      border-radius: 6px;
    }

    .btn-primary {
      background: var(--primary);
      border: none;
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    /* 矩陣設定與輸入控制項 */
    .form-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .input-num {
      width: 70px;
      padding: 0.5rem;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      color: var(--text-main);
      text-align: center;
      font-size: 1rem;
    }

    .matrix-grid-wrapper {
      overflow-x: auto;
      padding: 0.5rem 0;
    }

    .matrix-input-table {
      border-collapse: separate;
      border-spacing: 6px;
      margin: 0 auto;
    }

    .matrix-input-table td input {
      width: 65px;
      padding: 0.5rem;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      color: var(--text-main);
      text-align: center;
      font-size: 1rem;
    }

    .matrix-input-table td.augmented-sep {
      border-right: 2px dashed var(--primary);
      padding-right: 6px;
    }

    /* 計算過程與步驟顯示 */
    .steps-container {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      margin-top: 1rem;
    }

    .step-card {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1rem;
    }

    .step-title {
      font-weight: 600;
      color: #a855f7;
      margin-bottom: 0.75rem;
      font-size: 0.95rem;
    }

    /* 分數與矩陣渲染樣式 */
    .matrix-display {
      display: inline-flex;
      align-items: center;
      margin: 0.5rem 0;
      border-left: 2px solid var(--text-main);
      border-right: 2px solid var(--text-main);
      padding: 0 8px;
      border-radius: 4px;
    }

    .matrix-table {
      border-collapse: collapse;
    }

    .matrix-table td {
      padding: 6px 12px;
      text-align: center;
      font-family: "Fira Code", monospace;
    }

    .fraction {
      display: inline-flex;
      flex-direction: column;
      vertical-align: middle;
      text-align: center;
      font-size: 0.9em;
    }

    .fraction .num {
      border-bottom: 1px solid var(--text-main);
      padding: 0 2px;
    }

    .fraction .den {
      padding: 0 2px;
    }

    /* --------------------------------------------------
       Gemini AI 專用樣式
    -------------------------------------------------- */
    .ai-input-text {
      width: 100%;
      height: 100px;
      background: var(--bg-color);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.75rem;
      font-size: 1rem;
      resize: vertical;
    }

    .ai-input-text:focus {
      outline: none;
      border-color: var(--primary);
    }

    .ai-response-box {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--primary);
      border-radius: 8px;
      padding: 1.25rem;
      color: var(--text-main);
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* --------------------------------------------------
       函數圖形 專用樣式
    -------------------------------------------------- */
    .symbol-btn-group {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      margin-top: 0.5rem;
    }

    .canvas-container {
      position: relative;
      width: 100%;
      height: 420px;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
    }

    .canvas-container:active {
      cursor: grabbing;
    }

    #plot-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .plot-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    @media (max-width: 768px) {
      .grid-container {
        grid-template-columns: repeat(1, 1fr);
      }
      .home-title {
        font-size: 2.8rem;
      }
    }
  </style>
</head>
<body>

  <!-- ================= 頁面 1：首頁 ================= -->
  <section id="page-home" class="view active">
    <h1 class="home-title">小工具</h1>
    <button class="btn-gradient" onclick="navigateTo('page-menu')">前往功能選單</button>
  </section>

  <!-- ================= 頁面 2：功能選單 (3x3 網格) ================= -->
  <section id="page-menu" class="view">
    <div class="menu-header">
      <h2 class="menu-title">功能選單</h2>
      <button class="btn" onclick="navigateTo('page-home')">返回首頁</button>
    </div>
    
    <div class="grid-container">
      <div class="card interactive" onclick="openGaussModal()">
        <h3 class="card-title">高斯消去法計算工具</h3>
      </div>
      <div class="card interactive" onclick="openGeminiModal()">
        <h3 class="card-title">🤖 Gemini 數學知識 AI 導師</h3>
      </div>
      <div class="card interactive" onclick="openPlotModal()">
        <h3 class="card-title">📈 函數圖形繪製工具</h3>
      </div>
      <div class="card card-placeholder"><span class="card-title">預留位置</span></div>
      <div class="card card-placeholder"><span class="card-title">預留位置</span></div>
      <div class="card card-placeholder"><span class="card-title">預留位置</span></div>
      <div class="card card-placeholder"><span class="card-title">預留位置</span></div>
      <div class="card card-placeholder"><span class="card-title">預留位置</span></div>
      <div class="card card-placeholder"><span class="card-title">預留位置</span></div>
    </div>
  </section>

  <!-- ================= 彈窗 1：高斯消去法計算工具 ================= -->
  <div id="gauss-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">高斯消去法計算工具 (全程分數精確運算)</h3>
        <button class="close-btn" onclick="closeGaussModal()">&times;</button>
      </div>
      <div class="modal-body">
        
        <div class="form-group">
          <label>增廣矩陣大小：</label>
          <input type="number" id="input-m" class="input-num" value="3" min="1" max="6" inputmode="numeric"> 列 (m) &times;
          <input type="number" id="input-n" class="input-num" value="3" min="1" max="6" inputmode="numeric"> + 1 行 (n+1)
          <button class="btn btn-primary" onclick="generateMatrixInput()">生成矩陣</button>
        </div>

        <div id="matrix-input-section" style="display: none;">
          <hr style="border-color: var(--border-color); margin: 0.5rem 0;">
          <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.5rem;">請輸入矩陣係數與常數項 (僅限整數)：</p>
          <div class="matrix-grid-wrapper">
            <table class="matrix-input-table" id="matrix-table"></table>
          </div>
          <div class="form-group" style="margin-top: 1rem;">
            <button class="btn btn-primary" onclick="calculateGauss()">開始計算</button>
            <button class="btn" onclick="clearMatrixInputs()">清空重填</button>
          </div>
        </div>

        <div id="output-section"></div>

      </div>

  <!-- ================= 彈窗 2：Gemini 數學知識 AI 導師 ================= -->
  <div id="gemini-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">🤖 Gemini 數學與科學 AI 導師</h3>
        <button class="close-btn" onclick="closeGeminiModal()">&times;</button>
      </div>
      <div class="modal-body">
        
        <div class="form-group">
          <label>Gemini API Key：</label>
          <input type="password" id="gemini-api-key" class="input-num" style="width: 250px; text-align: left;" placeholder="請在此貼上 API Key">
          <span style="font-size: 0.8rem; color: var(--text-muted);">（僅存於本機瀏覽器，不會上傳）</span>
        </div>

        <div>
          <label style="display: block; margin-bottom: 0.5rem;">請輸入你想請教的數學或科學問題：</label>

        <button class="close-btn" onclick="closePlotModal()">&times;</button>
      </div>
      <div class="modal-body">
        
        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
          <div class="form-group" style="width: 100%;">

            <input type="text" id="func-input" class="ai-input-text" style="height: 42px; flex: 1; padding: 0.5rem 0.8rem; font-family: monospace; font-size: 1.1rem;" value="x^2 - 4" placeholder="例如: sin(x) * x, x^3 - 3*x, sqrt(x)">
            <button class="btn btn-primary" onclick="drawFunction()">繪製</button>
          </div>
          
          <div class="symbol-btn-group">
            <button class="btn btn-sm" onclick="insertSymbol('x')">x</button>
            <button class="btn btn-sm" onclick="insertSymbol('^')">^</button>
            <button class="btn btn-sm" onclick="insertSymbol('sin(')">sin</button>
            <button class="btn btn-sm" onclick="insertSymbol('cos(')">cos</button>
            <button class="btn btn-sm" onclick="insertSymbol('tan(')">tan</button>
            <button class="btn btn-sm" onclick="insertSymbol('sqrt(')">sqrt</button>
            <button class="btn btn-sm" onclick="insertSymbol('log(')">ln</button>
            <button class="btn btn-sm" onclick="insertSymbol('abs(')">abs</button>
            <button class="btn btn-sm" onclick="insertSymbol('exp(')">exp</button>
            <button class="btn btn-sm" onclick="insertSymbol('pi')">π</button>
            <button class="btn btn-sm" onclick="insertSymbol('e')">e</button>
          </div>
        </div>

        <div class="canvas-container" id="canvas-container">
          <canvas id="plot-canvas"></canvas>
        </div>

        <div class="plot-controls">
          <div>
            <span>💡 提示：使用<b>滑鼠滾輪</b>放大/縮小，<b>拖曳</b>可平移視角</span>
          </div>
          <div style="display: flex; gap: 0.5rem;">
            <button class="btn btn-sm" onclick="zoomPlot(1.2)">放大 +</button>
            <button class="btn btn-sm" onclick="zoomPlot(0.8)">縮小 -</button>
            <button class="btn btn-sm" onclick="resetPlotView()">重置視角</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    /* ==================================================
       1. 頁面切換控制
    ================================================== */
    function navigateTo(pageId) {
      document.querySelectorAll('.view').forEach(view => {
        view.classList.remove('active');
      });
      document.getElementById(pageId).classList.add('active');
    }

    /* ==================================================
       2. Modal 控制 (修復 Canvas 渲染尺寸 Bug)
    ================================================== */
    function openGaussModal() {
      document.getElementById('gauss-modal').classList.add('active');
      generateMatrixInput();
    }

    function closeGaussModal() {
      document.getElementById('gauss-modal').classList.remove('active');
    }

    function openGeminiModal() {
      document.getElementById('gemini-modal').classList.add('active');
      const savedKey = localStorage.getItem('gemini_api_key');
      if (savedKey) {
        document.getElementById('gemini-api-key').value = savedKey;
      }
    }

    function closeGeminiModal() {
      document.getElementById('gemini-modal').classList.remove('active');
    }

    function openPlotModal() {
      document.getElementById('plot-modal').classList.add('active');
      // Bug Fix: 延遲等待 DOM 完全展開繪製，確保尺寸計算正確
      requestAnimationFrame(() => {
        initPlotCanvas();
      });
    }

    function closePlotModal() {
      document.getElementById('plot-modal').classList.remove('active');
    }

    /* ==================================================
       3. 核心分數運算 (Fraction Math)
    ================================================== */
    function gcd(a, b) {
      a = Math.abs(a);
      b = Math.abs(b);
      while (b) {
        let t = b;
        b = a % b;
        a = t;
      }
      return a;
    }

    class Fraction {
      constructor(n, d = 1) {
        if (d === 0) throw new Error("分母不能為 0");
        if (d < 0) { n = -n; d = -d; }
        const g = gcd(n, d);
        this.n = n / g;
        this.d = d / g;
      }

      add(f) { return new Fraction(this.n * f.d + f.n * this.d, this.d * f.d); }
      sub(f) { return new Fraction(this.n * f.d - f.n * this.d, this.d * f.d); }
      mul(f) { return new Fraction(this.n * f.n, this.d * f.d); }
      div(f) { return new Fraction(this.n * f.d, this.d * f.n); }
      isZero() { return this.n === 0; }
      
      toHTML() {
        if (this.d === 1) return `${this.n}`;
        if (this.n < 0) {
          return `-<span class="fraction"><span class="num">${Math.abs(this.n)}</span><span class="den">${this.d}</span></span>`;
        }
        return `<span class="fraction"><span class="num">${this.n}</span><span class="den">${this.d}</span></span>`;
      }
    }

    /* ==================================================
       4. 高斯消去法 UI (修復負數輸入過濾 Bug)
    ================================================== */
    let currentM = 3, currentN = 4;

    function generateMatrixInput() {
      const m = parseInt(document.getElementById('input-m').value);
      const n = parseInt(document.getElementById('input-n').value) + 1;

      if (isNaN(m) || isNaN(n) || m < 1 || n < 2) {
        alert("請輸入有效的列數與行數！");
        return;
      }

      currentM = m;
      currentN = n;

      const table = document.getElementById('matrix-table');
      table.innerHTML = '';

      for (let i = 0; i < m; i++) {
        const tr = document.createElement('tr');
        for (let j = 0; j < n; j++) {
          const td = document.createElement('td');
          if (j === n - 2) td.classList.add('augmented-sep');
          
          const input = document.createElement('input');
          input.type = 'text'; 
          input.id = `cell-${i}-${j}`;
          input.value = (i === j) ? '1' : '0';

          // Bug Fix: 正確處理負號 (-) 與整數輸入
          input.addEventListener('input', function() {
            let val = this.value;
            let isNeg = val.startsWith('-');
            let clean = val.replace(/[^0-9]/g, '');
            this.value = (isNeg ? '-' : '') + clean;
          });

          td.appendChild(input);
          tr.appendChild(td);
        }
        table.appendChild(tr);
      }

      document.getElementById('matrix-input-section').style.display = 'block';
      document.getElementById('output-section').innerHTML = '';
    }

    function clearMatrixInputs() {
      for (let i = 0; i < currentM; i++) {
        for (let j = 0; j < currentN; j++) {
          document.getElementById(`cell-${i}-${j}`).value = 0;
        }
      }
    }

    function renderMatrixHTML(mat) {
      let html = '<div class="matrix-display"><table class="matrix-table">';
      for (let i = 0; i < mat.length; i++) {
        html += '<tr>';
        for (let j = 0; j < mat[i].length; j++) {
          html += `<td>${mat[i][j].toHTML()}</td>`;
        }
        html += '</tr>';
      }
      html += '</table></div>';
      return html;
    }

    function calculateGauss() {
      const output = document.getElementById('output-section');
      output.innerHTML = '<h4 style="margin-top:1rem;">計算步驟與結果：</h4><div class="steps-container" id="steps-list"></div>';
      const stepsList = document.getElementById('steps-list');

      let A = [];
      for (let i = 0; i < currentM; i++) {
        let row = [];
        for (let j = 0; j < currentN; j++) {
          const val = parseInt(document.getElementById(`cell-${i}-${j}`).value) || 0;
          row.push(new Fraction(val, 1));
        }
        A.push(row);
      }

      function addStep(title, matrixState) {
        const stepDiv = document.createElement('div');
        stepDiv.className = 'step-card';
        stepDiv.innerHTML = `<div class="step-title">${title}</div>${renderMatrixHTML(matrixState)}`;
        stepsList.appendChild(stepDiv);
      }

      addStep("初始增廣矩陣 state:", A);

      let pivotRow = 0;
      for (let col = 0; col < currentN - 1 && pivotRow < currentM; col++) {
        let sel = pivotRow;
        while (sel < currentM && A[sel][col].isZero()) {
          sel++;
        }

        if (sel === currentM) continue;

        if (sel !== pivotRow) {
          [A[pivotRow], A[sel]] = [A[sel], A[pivotRow]];
          addStep(`交換第 ${pivotRow + 1} 列 與 第 ${sel + 1} 列`, A);
        }

        let pivotVal = A[pivotRow][col];
        if (pivotVal.n !== pivotVal.d) {
          for (let j = col; j < currentN; j++) {
            A[pivotRow][j] = A[pivotRow][j].div(pivotVal);
          }
          addStep(`將第 ${pivotRow + 1} 列乘以 ${new Fraction(pivotVal.d, pivotVal.n).toHTML()}（使主元為 1）`, A);
        }

        for (let i = 0; i < currentM; i++) {
          if (i !== pivotRow && !A[i][col].isZero()) {
            let factor = A[i][col];
            for (let j = col; j < currentN; j++) {
              A[i][j] = A[i][j].sub(factor.mul(A[pivotRow][j]));
            }
            addStep(`將第 ${i + 1} 列減去 (第 ${pivotRow + 1} 列 &times; ${factor.toHTML()})`, A);
          }
        }
        pivotRow++;
      }

      addStep("最終簡約列梯形式 (RREF) 求解完成", A);
    }

    /* ==================================================
       5. Gemini AI API 串接
    ================================================== */
    async function askGeminiAI() {
      const apiKey = document.getElementById('gemini-api-key').value.trim();
      const prompt = document.getElementById('gemini-prompt').value.trim();
      const responseSection = document.getElementById('gemini-response-section');
      const responseDiv = document.getElementById('gemini-response');

      if (!apiKey) { alert("請輸入 Gemini API Key！"); return; }
      if (!prompt) { alert("請輸入問題內容！"); return; }

      localStorage.setItem('gemini_api_key', apiKey);
      responseSection.style.display = 'block';
      responseDiv.innerText = "⏳ AI 正在思考並推導數學邏輯中...";

      const systemInstruction = "你是一位資深的數學與科學導師。請使用繁體中文、條理清晰且嚴謹地回答問題。若有數學公式，請務必使用 LaTeX 格式（例如 $x^2 + y^2 = r^2$ 或 $$\\begin{bmatrix} a & b \\\\ c & d \\end{bmatrix}$$）來表示。";

      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [{ text: `${systemInstruction}\n\n學生提問：${prompt}` }]
            }]
          })
        });

        const data = await res.json();
        if (data.error) {
          responseDiv.innerText = `❌ API 錯誤: ${data.error.message}`;
          return;
        }

        const replyText = data.candidates[0].content.parts[0].text;
        responseDiv.innerText = replyText;

        renderMathInElement(responseDiv, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ],
          throwOnError: false
        });

      } catch (err) {
        responseDiv.innerText = "❌ 請求失敗，請檢查網路連線或 API Key 是否正確。";
        console.error(err);
      }
    }

    /* ==================================================
       6. 函數圖形繪製核心 (修復數學隱式乘法與繪圖尺寸 Bug)
    ================================================== */
    let canvas, ctx;
    let offsetX = 0, offsetY = 0;
    let scale = 40;
    let isDragging = false;
    let startX, startY;
    let isCanvasInitialized = false;

    function initPlotCanvas() {
      const container = document.getElementById('canvas-container');
      canvas = document.getElementById('plot-canvas');
      
      // Bug Fix: 動態綁定實際 DOM 的寬高
      canvas.width = container.clientWidth || 800;
      canvas.height = container.clientHeight || 420;
      ctx = canvas.getContext('2d');

      offsetX = canvas.width / 2;
      offsetY = canvas.height / 2;

      if (!isCanvasInitialized) {
        canvas.onmousedown = (e) => {
          isDragging = true;
          startX = e.clientX - offsetX;
          startY = e.clientY - offsetY;
        };

        window.onmousemove = (e) => {
          if (!isDragging) return;
          offsetX = e.clientX - startX;
          offsetY = e.clientY - startY;
          drawPlot();
        };

        window.onmouseup = () => { isDragging = false; };

        canvas.onwheel = (e) => {
          e.preventDefault();
          const zoomFactor = e.deltaY < 0 ? 1.15 : 0.85;
          zoomPlot(zoomFactor);
        };

        document.getElementById('func-input').addEventListener('input', drawFunction);
        isCanvasInitialized = true;
      }

      drawFunction();
    }

    function insertSymbol(sym) {
      const input = document.getElementById('func-input');
      const start = input.selectionStart;
      const end = input.selectionEnd;
      const val = input.value;
      input.value = val.substring(0, start) + sym + val.substring(end);
      input.focus();
      input.selectionStart = input.selectionEnd = start + sym.length;
      drawFunction();
    }

    function zoomPlot(factor) {
      scale *= factor;
      if (scale < 5) scale = 5;
      if (scale > 1000) scale = 1000;
      drawPlot();
    }

    function resetPlotView() {
      scale = 40;
      offsetX = canvas.width / 2;
      offsetY = canvas.height / 2;
      drawPlot();
    }

    function parseFunction(expr) {
      try {
        let jsExpr = expr
          .replace(/pi/g, 'Math.PI')
          .replace(/\be\b/g, 'Math.E')
          .replace(/\bsin\b/g, 'Math.sin')
          .replace(/\bcos\b/g, 'Math.cos')
          .replace(/\btan\b/g, 'Math.tan')
          .replace(/\bsqrt\b/g, 'Math.sqrt')
          .replace(/\blog\b/g, 'Math.log')
          .replace(/\babs\b/g, 'Math.abs')
          .replace(/\bexp\b/g, 'Math.exp')
          .replace(/\^/g, '**');

        // Bug Fix: 增強隱式乘法補全 (例如 2x -> 2*x, x(x+1) -> x*(x+1))
        jsExpr = jsExpr.replace(/(\d)([a-zA-Z\(])/g, '$1*$2');         jsExpr = jsExpr.replace(/(x\vert{}\))(\d|[a-zA-Z\(])/g, '$1*$2');

        return new Function('x', `return ${jsExpr};`);
      } catch (err) {
        return null;
      }
    }

    let currentFunc = null;

    function drawFunction() {
      const expr = document.getElementById('func-input').value.trim();
      currentFunc = parseFunction(expr);
      drawPlot();
    }

    function drawPlot() {
      if (!ctx || !canvas) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      let step = 1;
      if (scale < 20) step = 5;
      if (scale < 8) step = 10;
      if (scale > 80) step = 0.5;
      if (scale > 200) step = 0.1;

      ctx.lineWidth = 1;
      ctx.font = '12px Roboto, sans-serif';

      // 垂直格線
      const startXVal = Math.floor((-offsetX) / scale / step) * step;
      const endXVal = Math.ceil((canvas.width - offsetX) / scale / step) * step;

      for (let x = startXVal; x <= endXVal; x += step) {
        const px = offsetX + x * scale;
        ctx.strokeStyle = '#27272a';
        ctx.beginPath();
        ctx.moveTo(px, 0);
        ctx.lineTo(px, canvas.height);
        ctx.stroke();

        if (Math.abs(x) > 1e-6) {
          ctx.fillStyle = '#71717a';
          ctx.fillText(Number(x.toFixed(2)), px + 2, offsetY + 14);
        }
      }

      // 水平格線
      const startYVal = Math.floor((offsetY - canvas.height) / scale / step) * step;
      const endYVal = Math.ceil(offsetY / scale / step) * step;

      for (let y = startYVal; y <= endYVal; y += step) {
        const py = offsetY - y * scale;
        ctx.strokeStyle = '#27272a';
        ctx.beginPath();
        ctx.moveTo(0, py);
        ctx.lineTo(canvas.width, py);
        ctx.stroke();

        if (Math.abs(y) > 1e-6) {
          ctx.fillStyle = '#71717a';
          ctx.fillText(Number(y.toFixed(2)), offsetX + 4, py - 4);
        }
      }

      // 軸線
      ctx.strokeStyle = '#9ca3af';
      ctx.lineWidth = 2;

      ctx.beginPath();
      ctx.moveTo(0, offsetY);
      ctx.lineTo(canvas.width, offsetY);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(offsetX, 0);
      ctx.lineTo(offsetX, canvas.height);
      ctx.stroke();

      // 繪製函數
      if (!currentFunc) return;

      ctx.strokeStyle = '#a855f7';
      ctx.lineWidth = 2.5;
      ctx.beginPath();

      let isDrawing = false;
      const stepPx = 1;

      for (let px = 0; px <= canvas.width; px += stepPx) {
        const x = (px - offsetX) / scale;
        try {
          const y = currentFunc(x);

          if (typeof y === 'number' && !isNaN(y) && isFinite(y)) {
            const py = offsetY - y * scale;
            if (!isDrawing) {
              ctx.moveTo(px, py);
              isDrawing = true;
            } else {
              ctx.lineTo(px, py);
            }
          } else {
            isDrawing = false;
          }
        } catch (e) {
          isDrawing = false;
        }
      }
      ctx.stroke();
    }
  </script>
