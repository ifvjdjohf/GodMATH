<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工具箱與高斯消去法計算器</title>
  <style>
    /* --------------------------------------------------
       全站基礎與暗色主題設定 (CSS Variables)
    -------------------------------------------------- */
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e24;
      --card-hover: #2a2a32;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: #374151;
      --modal-bg: rgba(0, 0, 0, 0.75);
      --radius: 12px;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    /* --------------------------------------------------
       頁面切換控制 (Views)
    -------------------------------------------------- */
    .view {
      display: none;
      width: 100%;
      max-width: 1200px;
      padding: 2rem;
      animation: fadeIn 0.4s ease-in-out forwards;
    }

    .view.active {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* --------------------------------------------------
       頁面 1：首頁 UI
    -------------------------------------------------- */
    #page-home {
      text-align: center;
    }

    .home-title {
      font-size: 4rem;
      font-weight: 800;
      margin-bottom: 2rem;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
    }

    .btn-gradient {
      background: var(--primary-gradient);
      color: #fff;
      border: none;
      padding: 1rem 2.5rem;
      font-size: 1.25rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-gradient:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(99, 102, 241, 0.6);
    }

    /* --------------------------------------------------
       頁面 2：3x3 網格選單 UI
    -------------------------------------------------- */
    .menu-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .menu-title {
      font-size: 2rem;
      font-weight: 700;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
      width: 100%;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 2rem;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      transition: all 0.3s ease;
      box-shadow: var(--shadow);
    }

    .card.interactive {
      cursor: pointer;
      border-color: rgba(99, 102, 241, 0.4);
    }

    .card.interactive:hover {
      background-color: var(--card-hover);
      transform: translateY(-5px);
      border-color: var(--primary);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7);
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .card-placeholder {
      color: var(--text-muted);
      font-size: 0.9rem;
      border: 2px dashed var(--border-color);
      background: transparent;
    }

    /* --------------------------------------------------
       彈窗 / Modal (高斯消去法工具)
    -------------------------------------------------- */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: var(--modal-bg);
      backdrop-filter: blur(5px);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      width: 100%;
      max-width: 900px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow);
      animation: modalUp 0.3s ease;
      overflow: hidden;
    }

    @keyframes modalUp {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 1.3rem;
      font-weight: 700;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.8rem;
      cursor: pointer;
      line-height: 1;
    }

    .close-btn:hover {
      color: var(--text-main);
    }

    .modal-body {
      padding: 1.5rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* 通用按鈕風格 */
    .btn {
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: #2b2b36;
      color: var(--text-main);
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      background: #3b3b4a;
    }

    .btn-primary {
      background: var(--primary);
      border: none;
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    /* 矩陣設定與輸入控制項 */
    .form-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .input-num {
      width: 70px;
      padding: 0.5rem;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      color: var(--text-main);
      text-align: center;
      font-size: 1rem;
    }

    .matrix-grid-wrapper {
      overflow-x: auto;
      padding: 0.5rem 0;
    }

    .matrix-input-table {
      border-collapse: separate;
      border-spacing: 6px;
      margin: 0 auto;
    }

    .matrix-input-table td input {
      width: 65px;
      padding: 0.5rem;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      color: var(--text-main);
      text-align: center;
      font-size: 1rem;
    }

    .matrix-input-table td.augmented-sep {
      border-right: 2px dashed var(--primary);
      padding-right: 6px;
    }

    /* 計算過程與步驟顯示 */
    .steps-container {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      margin-top: 1rem;
    }

    .step-card {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1rem;
    }

    .step-title {
      font-weight: 600;
      color: #a855f7;
      margin-bottom: 0.75rem;
      font-size: 0.95rem;
    }

    /* 分數與矩陣渲染樣式 */
    .matrix-display {
      display: inline-flex;
      align-items: center;
      margin: 0.5rem 0;
      border-left: 2px solid var(--text-main);
      border-right: 2px solid var(--text-main);
      padding: 0 8px;
      border-radius: 4px;
    }

    .matrix-table {
      border-collapse: collapse;
    }

    .matrix-table td {
      padding: 6px 12px;
      text-align: center;
      font-family: "Fira Code", monospace;
    }

    .fraction {
      display: inline-flex;
      flex-direction: column;
      vertical-align: middle;
      text-align: center;
      font-size: 0.9em;
    }

    .fraction .num {
      border-bottom: 1px solid var(--text-main);
      padding: 0 2px;
    }

    .fraction .den {
      padding: 0 2px;
    }

    /* 響應式佈局 */
    @media (max-width: 768px) {
      .grid-container {
        grid-template-columns: repeat(1, 1fr);
      }
      .home-title {
        font-size: 2.8rem;
      }
    }
  </style>
</head>
<body>

  <!-- ================= 頁面 1：首頁 ================= -->
  <section id="page-home" class="view active">
    <h1 class="home-title">小工具</h1>
    <button class="btn-gradient" onclick="navigateTo('page-menu')">前往功能選單</button>
  </section>

  <!-- ================= 頁面 2：功能選單 (3x3 網格) ================= -->
  <section id="page-menu" class="view">
    <div class="menu-header">
      <h2 class="menu-title">功能選單</h2>
      <button class="btn" onclick="navigateTo('page-home')">返回首頁</button>
    </div>
    
    <div class="grid-container">
      <!-- 1. 高斯消去法卡片 -->
      <div class="card interactive" onclick="openGaussModal()">
        <h3 class="card-title">高斯消去法計算工具</h3>
      </div>
      <!-- 2 ~ 9 預留位置 -->
      <div class="card card-placeholder"><span class="card-title">預留位置</span></div>
      <div class="card card-placeholder"><span class="card-title">預留位置</span></div>
      <div class="card card-placeholder"><span class="card-title">預留位置</span></div>
      <div class="card card-placeholder"><span class="card-title">預留位置</span></div>
      <div class="card card-placeholder"><span class="card-title">預留位置</span></div>
      <div class="card card-placeholder"><span class="card-title">預留位置</span></div>
      <div class="card card-placeholder"><span class="card-title">預留位置</span></div>
      <div class="card card-placeholder"><span class="card-title">預留位置</span></div>
    </div>
  </section>

  <!-- ================= 彈窗：高斯消去法計算工具 ================= -->
  <div id="gauss-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">高斯消去法計算工具 (全程分數精確運算)</h3>
        <button class="close-btn" onclick="closeGaussModal()">&times;</button>
      </div>
      <div class="modal-body">
        
        <!-- 階段一：矩陣維度設定 -->
        <div class="form-group">
          <label>增廣矩陣大小：</label>
          <input type="number" id="input-m" class="input-num" value="3" min="1" max="6" inputmode="numeric"> 列 (m) &times;
          <input type="number" id="input-n" class="input-num" value="3" min="1" max="6" inputmode="numeric"> + 1 行 (n+1)
          <button class="btn btn-primary" onclick="generateMatrixInput()">生成矩陣</button>
        </div>

        <!-- 階段二：數值輸入區 -->
        <div id="matrix-input-section" style="display: none;">
          <hr style="border-color: var(--border-color); margin: 0.5rem 0;">
          <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.5rem;">請輸入矩陣係數與常數項 (僅限整數)：</p>
          <div class="matrix-grid-wrapper">
            <table class="matrix-input-table" id="matrix-table"></table>
          </div>
          <div class="form-group" style="margin-top: 1rem;">
            <button class="btn btn-primary" onclick="calculateGauss()">開始計算</button>
            <button class="btn" onclick="clearMatrixInputs()">清空重填</button>
          </div>
        </div>

        <!-- 階段三：步驟與結果展示區 -->
        <div id="output-section"></div>

      </div>
    </div>
  </div>

  <script>
    /* ==================================================
       1. 頁面切換控制 (SPA Navigation)
    ================================================== */
    function navigateTo(pageId) {
      document.querySelectorAll('.view').forEach(view => {
        view.classList.remove('active');
      });
      document.getElementById(pageId).classList.add('active');
    }

    /* ==================================================
       2. Modal 控制
    ================================================== */
    function openGaussModal() {
      document.getElementById('gauss-modal').classList.add('active');
      generateMatrixInput(); // 預設自動生成一次
    }

    function closeGaussModal() {
      document.getElementById('gauss-modal').classList.remove('active');
    }

    /* ==================================================
       3. 核心數學庫：精確分數運算 (Fraction Math)
    ================================================== */
    function gcd(a, b) {
      a = Math.abs(a);
      b = Math.abs(b);
      while (b) {
        let t = b;
        b = a % b;
        a = t;
      }
      return a;
    }

    class Fraction {
      constructor(n, d = 1) {
        if (d === 0) throw new Error("分母不能為 0");
        if (d < 0) { n = -n; d = -d; }
        const g = gcd(n, d);
        this.n = n / g;
        this.d = d / g;
      }

      add(f) { return new Fraction(this.n * f.d + f.n * this.d, this.d * f.d); }
      sub(f) { return new Fraction(this.n * f.d - f.n * this.d, this.d * f.d); }
      mul(f) { return new Fraction(this.n * f.n, this.d * f.d); }
      div(f) { return new Fraction(this.n * f.d, this.d * f.n); }
      isZero() { return this.n === 0; }
      
      // 輸出為 HTML 格式（避免小數點）
      toHTML() {
        if (this.d === 1) return `${this.n}`;
        if (this.n < 0) {
          return `-<span class="fraction"><span class="num">${Math.abs(this.n)}</span><span class="den">${this.d}</span></span>`;
        }
        return `<span class="fraction"><span class="num">${this.n}</span><span class="den">${this.d}</span></span>`;
      }

      toString() {
        return this.d === 1 ? `${this.n}` : `${this.n}/${this.d}`;
      }
    }

    /* ==================================================
       4. 動態 UI 產生與輸入處理 (含數字鍵盤與輸入過濾)
    ================================================== */
    let currentM = 3, currentN = 4;

    function generateMatrixInput() {
      const m = parseInt(document.getElementById('input-m').value);
      const n = parseInt(document.getElementById('input-n').value) + 1;

      if (isNaN(m) || isNaN(n) || m < 1 || n < 2) {
        alert("請輸入有效的列數與行數！");
        return;
      }

      currentM = m;
      currentN = n;

      const table = document.getElementById('matrix-table');
      table.innerHTML = '';

      for (let i = 0; i < m; i++) {
        const tr = document.createElement('tr');
        for (let j = 0; j < n; j++) {
          const td = document.createElement('td');
          if (j === n - 2) td.classList.add('augmented-sep'); // 增廣矩陣分隔線
          
          const input = document.createElement('input');
          input.type = 'text'; 
          input.inputMode = 'numeric'; // 觸發行動裝置數字鍵盤
          input.pattern = '[0-9]*';
          input.id = `cell-${i}-${j}`;
          input.value = (i === j) ? '1' : '0';

          // 1. 阻止輸入 e, +, . 等非整數符號
          input.addEventListener('keydown', function(e) {
            if (['e', 'E', '.', '+'].includes(e.key)) {
              e.preventDefault();
            }
          });

          // 2. 自動清理黏貼或不合法的非整數字元 (僅允許開頭為負號與數字)
          input.addEventListener('input', function() {
            let isNegative = this.value.startsWith('-');
            let cleanValue = this.value.replace(/[^0-9]/g, '');
            this.value = (isNegative ? '-' : '') + cleanValue;
          });

          td.appendChild(input);
          tr.appendChild(td);
        }
        table.appendChild(tr);
      }

      document.getElementById('matrix-input-section').style.display = 'block';
      document.getElementById('output-section').innerHTML = '';
    }

    function clearMatrixInputs() {
      for (let i = 0; i < currentM; i++) {
        for (let j = 0; j < currentN; j++) {
          document.getElementById(`cell-${i}-${j}`).value = 0;
        }
      }
    }

    /* ==================================================
       5. 高斯消去法邏輯與步驟記錄 (Gaussian Elimination)
    ================================================== */
    function renderMatrixHTML(mat) {
      let html = '<div class="matrix-display"><table class="matrix-table">';
      for (let i = 0; i < mat.length; i++) {
        html += '<tr>';
        for (let j = 0; j < mat[i].length; j++) {
          html += `<td>${mat[i][j].toHTML()}</td>`;
        }
        html += '</tr>';
      }
      html += '</table></div>';
      return html;
    }

    function calculateGauss() {
      const output = document.getElementById('output-section');
      output.innerHTML = '<h4 style="margin-top:1rem;">計算步驟與結果：</h4><div class="steps-container" id="steps-list"></div>';
      const stepsList = document.getElementById('steps-list');

      // 讀取輸入並轉為 Fraction 矩陣
      let A = [];
      for (let i = 0; i < currentM; i++) {
        let row = [];
        for (let j = 0; j < currentN; j++) {
          const val = parseInt(document.getElementById(`cell-${i}-${j}`).value) || 0;
          row.push(new Fraction(val, 1));
        }
        A.push(row);
      }

      function addStep(title, matrixState) {
        const stepDiv = document.createElement('div');
        stepDiv.className = 'step-card';
        stepDiv.innerHTML = `<div class="step-title">${title}</div>${renderMatrixHTML(matrixState)}`;
        stepsList.appendChild(stepDiv);
      }

      addStep("初始增廣矩陣 state:", A);

      let pivotRow = 0;
      for (let col = 0; col < currentN - 1 && pivotRow < currentM; col++) {
        // 尋找主元 (Pivot)
        let sel = pivotRow;
        while (sel < currentM && A[sel][col].isZero()) {
          sel++;
        }

        if (sel === currentM) continue; // 當前欄全為 0，跳過

        // 交換列
        if (sel !== pivotRow) {
          [A[pivotRow], A[sel]] = [A[sel], A[pivotRow]];
          addStep(`交換第 ${pivotRow + 1} 列 與 第 ${sel + 1} 列`, A);
        }

        // 將主元所在列首項化為 1 (Row scaling)
        let pivotVal = A[pivotRow][col];
        if (pivotVal.n !== pivotVal.d) { // 非 1
          for (let j = col; j < currentN; j++) {
            A[pivotRow][j] = A[pivotRow][j].div(pivotVal);
          }
          addStep(`將第 ${pivotRow + 1} 列乘以 ${new Fraction(pivotVal.d, pivotVal.n).toHTML()}（使主元為 1）`, A);
        }

        // 消去下方與上方的列 (RREF 消去)
        for (let i = 0; i < currentM; i++) {
          if (i !== pivotRow && !A[i][col].isZero()) {
            let factor = A[i][col];
            for (let j = col; j < currentN; j++) {
              A[i][j] = A[i][j].sub(factor.mul(A[pivotRow][j]));
            }
            addStep(`將第 ${i + 1} 列減去 (第 ${pivotRow + 1} 列 &times; ${factor.toHTML()})`, A);
          }
        }
        pivotRow++;
      }

      addStep("最終簡約列梯形式 (RREF) 求解完成", A);
    }
  </script>
</body>
</html>
